[project]
name = "data-pipeline"
version = "0.1.0"
description = "ShopStream: end-to-end, self-hosted marketplace data platform (Kafka, SeaweedFS S3, Spark, ClickHouse, dbt, Airflow, Metabase)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.104",
    "clickhouse-connect==1.9.0",
    "confluent-kafka==2.15.1",
    "dbt-clickhouse==1.10.3",
    "dbt-core==1.12.5",
    "faker==40.40.0",
    "psycopg[binary]==3.3.6",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "sqlfluff==4.3.0",
]
# The Spark job's runtime. Not a default dependency: the wheel bundles a Spark
# distribution, the host has no JVM, and the container installs it from airflow/Dockerfile.
# CI's spark job opts in with `uv sync --group spark`.
spark = [
    "pyspark==4.1.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# airflow/dags is on the path because the DAG modules import each other by bare name
# (`alerts`, `shopstream_assets`), exactly as Airflow does.
pythonpath = [".", "airflow/dags"]
addopts = "-ra"
markers = [
    "spark: needs a JVM and pyspark; run with `make spark-test`",
]
