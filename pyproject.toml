[project]
name = "data-pipeline"
version = "0.1.0"
description = "ShopStream: end-to-end, self-hosted marketplace data platform (Kafka, SeaweedFS S3, Spark, ClickHouse, dbt, Airflow, Metabase)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "sqlfluff==4.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
